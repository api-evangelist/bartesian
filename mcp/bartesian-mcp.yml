  tools_call: gated
  note: 'Anonymous introspection SUCCEEDS on this store. An unauthenticated `initialize` returns HTTP
    200 with serverInfo universal-commerce 0.1.0 and protocolVersion 2025-06-18, and an unauthenticated
    `tools/list` returns HTTP 200 with all 13 tools and their complete JSON Schema draft 2020-12 inputSchemas.
    Those live schemas are saved verbatim in bartesian-ucp-shopping-tools.json - they are the real contract,
    not a reconstruction from the ucp.dev OpenRPC document.

    Invoking a tool is a different matter. `tools/call` and `resources/list` both require meta.ucp-agent.profile
    (the HTTP UCP-Agent header) carrying the calling platform''s own UCP profile URI; without it the endpoint
    returns HTTP 422 and JSON-RPC error -32001 "UCP discovery failed" / invalid_profile_url. So the store
    publishes its tool contract openly and gates only execution.'
