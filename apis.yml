apis:
- aid: bartesian:commerce
  name: Bartesian Commerce (UCP Shopping)
  description: 'The agent-facing commerce surface of the Bartesian Shopify storefront.
    The store publishes a Universal Commerce Protocol merchant profile at
    https://bartesian.com/.well-known/ucp declaring UCP versions 2026-04-08 and
    2026-01-23, the dev.ucp.shopping service over both an MCP transport at
    https://bartesian.com/api/ucp/mcp and an embedded transport, and eight
    capabilities covering cart, checkout, fulfillment, discount, order and catalog
    search/lookup. Unlike most UCP storefronts, this endpoint answers an anonymous
    initialize and tools/list with HTTP 200, returning all 13 tools together with
    their full JSON Schema draft 2020-12 input schemas - the real contract, captured
    verbatim. Tool invocation is gated: every tool requires a meta.ucp-agent.profile
    URI, and an anonymous tools/call returns HTTP 422 with JSON-RPC error -32001.'
  humanURL: https://bartesian.com/agents.md
  baseURL: https://bartesian.com/api/ucp/mcp
