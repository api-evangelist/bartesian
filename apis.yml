aid: bartesian
name: Bartesian
description: 'Bartesian is a Chicago-based consumer appliance company founded in 2014
  by Ryan Close, maker of a capsule-based countertop cocktail machine that mixes
  bar-quality drinks on demand from a pod of bitters, juices and extracts plus the
  user''s own base spirit. The company launched off a Kickstarter campaign, took
  investment from Beam Suntory in 2016, and closed a US$20 million round led by
  Cleveland Avenue in 2021. It runs a razor-and-blade model selling machines and
  cocktail capsules direct to consumers, plus commercial placements in stadiums and
  airport lounges. Bartesian publishes no first-party developer program or REST API,
  but its Shopify storefront at bartesian.com exposes a real and unusually open
  agent-facing commerce surface: a published llms.txt and agents.md, a dedicated
  agentic-discovery sitemap, a Universal Commerce Protocol merchant profile at
  /.well-known/ucp, and a live MCP endpoint at /api/ucp/mcp that returns all 13 UCP
  Shopping tools with complete JSON Schema inputSchemas to an anonymous caller -
  gating execution, not discovery - alongside OAuth 2.0 / OpenID Connect discovery
  for Shopify customer accounts.'
