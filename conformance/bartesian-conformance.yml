    three payment handlers
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    dev.ucp.shopping declares transport "mcp"; the endpoint answers an anonymous
    initialize with 200 and protocolVersion 2025-06-18, serverInfo
    universal-commerce 0.1.0, and capabilities tools/prompts/resources/logging
- id: mcp-tools-list-anonymous
  name: Anonymous MCP tool discovery
  conforms: true
  evidence: POST tools/list without credentials returns 200 with all 13 tools and
    their full JSON Schema draft 2020-12 inputSchemas
  note: >-
    This is the check most agent surfaces in the catalog fail. Bartesian's store
    publishes its tool contract to any caller and gates only execution.
