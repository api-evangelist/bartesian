compliance_program:
  published: false
  certifications: []
  note: >-
    No trust center, SOC 2, ISO 27001, PCI DSS or HIPAA claim was found on any
    reachable Bartesian surface. Card data is handled by Shopify's payment
    handlers, never by the agent or by Bartesian's own endpoint.
regulatory_note: >-
  Bartesian sells cocktail capsules and machines. Age-verified and
  jurisdiction-restricted sale of alcohol-adjacent goods is a real regulatory
  surface for agent-driven checkout, and nothing in the published UCP profile,
  the tool schemas or agents.md documents an age-verification step. The UCP
  eligibility_invalid and requires_buyer_review paths exist to carry it, but
  Bartesian does not say whether or how it uses them.
