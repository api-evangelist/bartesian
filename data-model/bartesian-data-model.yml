note: >-
  Derived from the live tool inputSchemas the Bartesian storefront's own MCP
  endpoint returns to an anonymous caller, not from an OpenAPI (Bartesian
  publishes none). Entity internals are defined in the referenced ucp.dev JSON
  Schemas; recorded here are the entities this endpoint actually exposes, the
  identifier formats it publishes, and the relationships its tool surface
  implies.
id_scheme:
  style: Shopify global ID (GID)
  formats:
    cart: 'gid://shopify/Cart/abc123'
    checkout: 'gid://shopify/Checkout/abc123'
    order: 'gid://shopify/Order/123'
  source: id parameter descriptions in the live tool schemas
entities:
- name: product
  schema: https://ucp.dev/2026-04-08/schemas/shopping/catalog_lookup.json
  operations: [search_catalog, lookup_catalog, get_product]
  read_only: true
  description: A Bartesian catalog product (cocktail machine or capsule pack) with
    its variants, options, pricing and real-time availability.
  storefront_json: https://bartesian.com/products.json
  storefront_fields: [id, title, handle, body_html, published_at, created_at, updated_at,
    vendor, product_type, tags, variants, images, options]
- name: cart
  schema: https://ucp.dev/2026-04-08/schemas/shopping/cart.json
  operations: [create_cart, get_cart, update_cart, cancel_cart]
  fields: [line_items, buyer, context, attribution, fulfillment, discounts]
  description: A mutable basket of catalog line items held for an agent session.
- name: checkout
  schema: https://ucp.dev/2026-04-08/schemas/shopping/checkout.json
  operations: [create_checkout, get_checkout, update_checkout, complete_checkout, cancel_checkout]
  fields: [payment, line_items, buyer, context, attribution, cart_id, fulfillment,
    discounts]
  description: A purchase session carrying buyer, fulfillment and payment state; completing
    it places an order and requires both buyer approval and an idempotency key.
- name: order
  schema: https://ucp.dev/2026-04-08/schemas/shopping/order.json
  operations: [get_order]
  read_only: true
  description: The current-state snapshot of a placed order.
- name: payment_instrument
  operations: [create_checkout, update_checkout, complete_checkout]
  fields: [id, handler_id, type, billing_address]
  description: A card or wallet token supplied on checkout.payment.instruments[]. The
    agent never handles raw card data; handler_id names one of the store's declared
    payment handlers.
- name: message
  schema: https://ucp.dev/2026-04-08/schemas/shopping/types/message.json
  description: Error, warning or info message attached to any cart, checkout or order
    result; carries code, severity and an RFC 9535 JSONPath to the component it refers
    to.
